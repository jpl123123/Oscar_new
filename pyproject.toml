[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "oscar-ascend"
version = "0.2.8"
description = "External OSCAR INT2 KV attention for the pinned Qwen3.5 Ascend stack"
requires-python = ">=3.10"
dependencies = ["packaging>=23"]

[project.optional-dependencies]
test = ["pytest>=8", "torch>=2.5", "numpy>=1.26", "ruff>=0.11"]

[project.entry-points."vllm.general_plugins"]
oscar_ascend = "oscar_ascend.plugin:register"

[tool.setuptools.packages.find]
include = ["oscar_ascend*"]

[tool.setuptools.package-data]
oscar_ascend = ["upstream_fingerprints.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["npu: requires real Ascend NPU and Triton Ascend"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
